<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hand Mirror</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
  #stage { position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, #1b2030, #0b0d12 70%); }
  canvas { display: block; width: 100%; height: 100%; }
  #cam { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); width: 96px; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,.25); background: #000; z-index: 5; }
  #cam.mirror { transform: scaleX(-1); }
  #hud { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; z-index: 5; pointer-events: none; }
  #gesture { background: rgba(0,0,0,.55); backdrop-filter: blur(6px); padding: 8px 18px; border-radius: 999px; font-size: 18px; font-weight: 600; letter-spacing: .3px; min-width: 150px; text-align: center; }
  #status { position: fixed; top: calc(60px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 13px; opacity: .7; z-index: 5; pointer-events: none; }
  #flip { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5; background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 10px 16px; font-size: 14px; display: none; }
  #eyesWrap { position: fixed; top: calc(88px + env(safe-area-inset-top)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 5; pointer-events: none; }
  #eyes { display: flex; gap: 14px; }
  .eye { position: relative; width: 64px; height: 40px; border-radius: 50%; background: #f4f4f4; overflow: hidden; border: 2px solid rgba(255,255,255,.4); }
  .pupil { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #111; box-shadow: inset 0 0 0 5px #4a7bd0; }
  .lid { position: absolute; inset: 0; background: #c68642; transform-origin: top; transform: scaleY(0); }
  #eyeText { font-size: 13px; background: rgba(0,0,0,.55); padding: 4px 12px; border-radius: 999px; }
  #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0b0d12; padding: 24px; text-align: center; }
  #start .emoji { font-size: 72px; }
  #start button { background: #fff; color: #000; border: 0; border-radius: 999px; padding: 16px 36px; font-size: 18px; font-weight: 700; }
  #start p { margin: 0; opacity: .65; max-width: 320px; line-height: 1.4; font-size: 14px; }
  #err { color: #ff7a7a; font-size: 14px; max-width: 320px; }
</style>
</head>
<body>
<div id="stage"></div>
<video id="cam" playsinline muted autoplay></video>
<div id="hud"><div id="gesture">—</div></div>
<div id="eyesWrap">
  <div id="eyes">
    <div class="eye" id="eyeL"><div class="pupil"></div><div class="lid"></div></div>
    <div class="eye" id="eyeR"><div class="pupil"></div><div class="lid"></div></div>
  </div>
  <div id="eyeText">👁 Show your face</div>
</div>
<div id="status"></div>
<button id="flip">Flip camera</button>

<div id="start">
  <div class="emoji">✋🏽</div>
  <button id="startBtn">Start camera</button>
  <p>Show your hand to the camera. The 3D hand will copy your fingers.</p>
  <div id="err"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from "three";
import { HandLandmarker, FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("cam"), stage = $("stage"), gestureEl = $("gesture"), statusEl = $("status"), errEl = $("err");

/* ---------- Three.js scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -5, 5);
camera.position.z = 2;

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(0.5, 1, 1.5); scene.add(key);
const rim = new THREE.DirectionalLight(0x6aa8ff, 0.8); rim.position.set(-1, -0.5, -1); scene.add(rim);

const skin = new THREE.MeshStandardMaterial({ color: 0xc68642, roughness: 0.55, metalness: 0.05 });
const palmMat = new THREE.MeshStandardMaterial({ color: 0xb87a3d, roughness: 0.6, side: THREE.DoubleSide });
const jointMat = new THREE.MeshStandardMaterial({ color: 0xf1c8a0, roughness: 0.4, emissive: 0x000000 });

const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [9,10],[10,11],[11,12],
  [13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17]
];
const TIPS = [4, 8, 12, 16, 20];

const hand = new THREE.Group(); hand.visible = false; scene.add(hand);

const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 12);
const sphGeo = new THREE.SphereGeometry(1, 16, 12);
const bones = CONNECTIONS.map(() => { const m = new THREE.Mesh(cylGeo, skin); hand.add(m); return m; });
const joints = Array.from({ length: 21 }, () => { const m = new THREE.Mesh(sphGeo, jointMat.clone()); hand.add(m); return m; });

const PALM_IDX = [0, 1, 5, 9, 13, 17];
const palmGeo = new THREE.BufferGeometry();
palmGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6 * 3), 3));
palmGeo.setIndex([0,1,2, 0,2,3, 0,3,4, 0,4,5]);
const palm = new THREE.Mesh(palmGeo, palmMat); palm.frustumCulled = false; hand.add(palm);

const P = Array.from({ length: 21 }, () => new THREE.Vector3());   // smoothed world points
const T = Array.from({ length: 21 }, () => new THREE.Vector3());   // targets
const UP = new THREE.Vector3(0, 1, 0), tmp = new THREE.Vector3(), dir = new THREE.Vector3();
let havePrev = false;

/* ---------- state ---------- */
let landmarker = null, faceLm = null, frameN = 0, stream = null, facing = "user", mirror = true;
let vAspect = 0.75, lastVideoTime = -1, lastSeen = 0, pinching = false;

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  const sa = w / h;
  let hw, hh;
  if (sa < vAspect) { hw = vAspect / 2; hh = hw / sa; }
  else { hh = 0.5; hw = hh * sa; }
  camera.left = -hw; camera.right = hw; camera.top = hh; camera.bottom = -hh;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

/* ---------- setup ---------- */
async function loadModel() {
  statusEl.textContent = "Loading hand model…";
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const modelAssetPath = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
  const make = delegate => HandLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath, delegate },
    runningMode: "VIDEO", numHands: 1,
    minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
  });
  try { landmarker = await make("GPU"); }
  catch (e) { console.warn("GPU failed, using CPU", e); landmarker = await make("CPU"); }

  try {
    const makeFace = delegate => FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate },
      runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true
    });
    try { faceLm = await makeFace("GPU"); } catch (e) { faceLm = await makeFace("CPU"); }
  } catch (e) {
    console.warn("Face model failed", e);
    $("eyeText").textContent = "Eye tracking unavailable";
  }
}

/* ---------- eyes ---------- */
const eyeEls = { L: $("eyeL"), R: $("eyeR") };
const eyeS = { L: { x: 0, y: 0, b: 0 }, R: { x: 0, y: 0, b: 0 } };
function setEye(side, x, y, b) {
  const s = eyeS[side], k = 0.5;
  s.x += (x - s.x) * k; s.y += (y - s.y) * k; s.b += (b - s.b) * k;
  const el = eyeEls[side];
  el.children[0].style.transform = `translate(${s.x * 22}px, ${-s.y * 12}px)`;
  el.children[1].style.transform = `scaleY(${Math.min(1, s.b * 1.3)})`;
}
function updateEyes(res) {
  const cats = res.faceBlendshapes && res.faceBlendshapes[0] && res.faceBlendshapes[0].categories;
  if (!cats) {
    setEye("L", 0, 0, 0); setEye("R", 0, 0, 0);
    $("eyeText").textContent = "👁 Show your face";
    return;
  }
  const v = {}; cats.forEach(c => v[c.categoryName] = c.score);
  const bl = v.eyeBlinkLeft || 0, br = v.eyeBlinkRight || 0;
  // your left eye shows on the left, like a mirror
  const lx = (v.eyeLookInLeft || 0) - (v.eyeLookOutLeft || 0);
  const rx = (v.eyeLookOutRight || 0) - (v.eyeLookInRight || 0);
  const ly = (v.eyeLookUpLeft || 0) - (v.eyeLookDownLeft || 0);
  const ry = (v.eyeLookUpRight || 0) - (v.eyeLookDownRight || 0);
  setEye("L", lx, ly, bl); setEye("R", rx, ry, br);

  const gx = (lx + rx) / 2, gy = (ly + ry) / 2;
  let t;
  if (bl > 0.5 && br > 0.5) t = "😑 Blink";
  else if (bl > 0.55 && br < 0.3) t = "😉 Wink left";
  else if (br > 0.55 && bl < 0.3) t = "😉 Wink right";
  else if (Math.abs(gx) > Math.abs(gy) && Math.abs(gx) > 0.2) t = gx > 0 ? "👀 Looking right" : "👀 Looking left";
  else if (Math.abs(gy) > 0.2) t = gy > 0 ? "👀 Looking up" : "👀 Looking down";
  else t = "👁 Eyes open";
  $("eyeText").textContent = t;
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } }
  });
  video.srcObject = stream;
  await video.play();
  mirror = facing === "user";
  video.classList.toggle("mirror", mirror);
  await new Promise(r => video.videoWidth ? r() : (video.onloadedmetadata = r));
  vAspect = video.videoWidth / video.videoHeight;
  lastVideoTime = -1; havePrev = false;
  resize();
}

$("startBtn").onclick = async () => {
  errEl.textContent = "";
  $("startBtn").disabled = true; $("startBtn").textContent = "Loading…";
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("Camera needs HTTPS. Host this file (e.g. Vercel) and open the https link.");
    await startCamera();
    await loadModel();
    $("start").style.display = "none";
    $("flip").style.display = "block";
    statusEl.textContent = "Show your hand";
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    errEl.textContent = e.message || String(e);
    $("startBtn").disabled = false; $("startBtn").textContent = "Try again";
  }
};

$("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await startCamera(); } catch (e) { statusEl.textContent = "Can't switch camera"; }
};

/* ---------- gestures ---------- */
const d = (a, b) => a.distanceTo(b);
function classify(L) {
  const palmSize = d(L[0], L[9]) || 0.001;
  const ext = (tip, pip) => d(L[0], L[tip]) > d(L[0], L[pip]) * 1.12;
  const thumb = d(L[4], L[17]) > d(L[3], L[17]) * 1.05 && d(L[4], L[5]) > palmSize * 0.5;
  const f = [ext(8, 6), ext(12, 10), ext(16, 14), ext(20, 18)];
  const count = f.filter(Boolean).length;
  const pinchDist = d(L[4], L[8]) / palmSize;
  pinching = pinching ? pinchDist < 0.5 : pinchDist < 0.32;   // hysteresis
  let name;
  if (pinching) name = "🤏 Pinch";
  else if (count === 4) name = "🖐 Open";
  else if (count === 0 && !thumb) name = "✊ Fist";
  else if (count === 0 && thumb) name = "👍 Thumb";
  else if (f[0] && !f[1] && !f[2] && !f[3]) name = "☝️ Point";
  else if (f[0] && f[1] && !f[2] && !f[3]) name = "✌️ Peace";
  else if (f[0] && !f[1] && !f[2] && f[3]) name = "🤘 Rock";
  else name = `${count} finger${count === 1 ? "" : "s"}`;
  return { name, palmSize };
}

/* ---------- update 3D hand ---------- */
function updateHand(lm) {
  for (let i = 0; i < 21; i++) {
    const p = lm[i];
    T[i].set(
      (mirror ? 0.5 - p.x : p.x - 0.5) * vAspect,
      0.5 - p.y,
      -p.z * vAspect
    );
    if (!havePrev) P[i].copy(T[i]); else P[i].lerp(T[i], 0.55);
  }
  havePrev = true;

  const { name, palmSize } = classify(P);
  gestureEl.textContent = name;

  const r = palmSize * 0.085;
  joints.forEach((j, i) => {
    j.position.copy(P[i]);
    const tip = TIPS.includes(i);
    j.scale.setScalar(r * (tip ? 1.25 : i === 0 ? 1.5 : 1.1));
    j.material.emissive.setHex(pinching && (i === 4 || i === 8) ? 0xff7a00 : 0x000000);
  });
  CONNECTIONS.forEach(([a, b], i) => {
    const m = bones[i];
    dir.subVectors(P[b], P[a]);
    const len = dir.length();
    m.position.copy(tmp.addVectors(P[a], P[b]).multiplyScalar(0.5));
    m.scale.set(r * 0.85, len, r * 0.85);
    if (len > 1e-6) m.quaternion.setFromUnitVectors(UP, dir.normalize());
  });
  const pos = palmGeo.attributes.position;
  PALM_IDX.forEach((idx, k) => pos.setXYZ(k, P[idx].x, P[idx].y, P[idx].z));
  pos.needsUpdate = true;
  palmGeo.computeVertexNormals();
}

/* ---------- loop ---------- */
function loop(now) {
  requestAnimationFrame(loop);
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    if (faceLm && (frameN++ & 1) === 0) {
      try { updateEyes(faceLm.detectForVideo(video, now)); } catch (e) { console.warn(e); }
    }
    const res = landmarker.detectForVideo(video, now);
    if (res.landmarks && res.landmarks.length) {
      lastSeen = now;
      hand.visible = true;
      statusEl.textContent = "";
      updateHand(res.landmarks[0]);
    }
  }
  if (now - lastSeen > 400 && hand.visible) {
    hand.visible = false; havePrev = false;
    gestureEl.textContent = "—";
    statusEl.textContent = "Show your hand";
  }
  renderer.render(scene, camera);
}
</script>
</body>
</html>
